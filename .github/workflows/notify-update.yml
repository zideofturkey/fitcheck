name: Notify update by email

# Sends a "there's a new update" email to a fixed recipient list on every
# push to main, with a subject/body summarizing this push's commits in
# plain Turkish. Later this can be expanded to go out to all registered
# users instead of a fixed list.
on:
  push:
    branches:
      - main

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build email subject + body from this push's commits
        id: body
        run: |
          BEFORE="${{ github.event.before }}"
          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            RANGE="-n 1 ${{ github.sha }}"
          else
            RANGE="$BEFORE..${{ github.sha }}"
          fi

          COMMITS=$(git log $RANGE --pretty=format:"%s" --no-merges)
          COUNT=$(printf "%s\n" "$COMMITS" | grep -c . || true)
          if [ "$COUNT" -eq 0 ]; then
            COMMITS=$(git log -n 1 --pretty=format:"%s" --no-merges)
            COUNT=1
          fi

          simplify() {
            local line="$1"
            # Drop conventional-commit prefix (feat:, fix:, docs:, chore:, refactor:, test:, style:, perf:)
            line=$(echo "$line" | sed -E 's/^(feat|fix|docs|chore|refactor|test|style|perf)(\([^)]*\))?: *//')
            # Plain-language glossary for common technical jargon
            line=$(echo "$line" | sed -E \
              -e 's/GitHub Actions workflow.?u?/otomatik bildirim sistemi/gi' \
              -e 's/bulk-import/toplu veri aktarımı/gi' \
              -e 's/dishCategory/yemek kategorisi/gi' \
              -e 's/DishLine/yemek malzemesi/gi' \
              -e 's/FoodPickerModal/besin seçme ekranı/gi' \
              -e 's/API/sistem/gi' \
              -e 's/tab bar/sekme çubuğu/gi' \
              -e 's/backend/arka plan/gi' \
              -e 's/frontend/arayüz/gi')
            # Capitalize first letter
            line="$(echo "${line:0:1}" | tr '[:lower:]' '[:upper:]')${line:1}"
            echo "$line"
          }

          SIMPLIFIED=""
          while IFS= read -r line; do
            [ -z "$line" ] && continue
            s="$(simplify "$line")"
            SIMPLIFIED="${SIMPLIFIED}${SIMPLIFIED:+ • }${s}"
          done <<< "$COMMITS"

          {
            echo "body<<EOF"
            echo "FitCheck'e yeni bir güncelleme yapıldı."
            echo ""
            echo "Son değişiklikler:"
            while IFS= read -r line; do
              [ -z "$line" ] && continue
              echo "- $(simplify "$line")"
            done <<< "$COMMITS"
            echo ""
            echo "Detaylar: https://github.com/${{ github.repository }}/commit/${{ github.sha }}"
            echo ""
            echo "Yemenin tadını çıkarın."
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

          echo "count=$COUNT" >> "$GITHUB_OUTPUT"
          {
            echo "notifybody<<EOF"
            echo "$SIMPLIFIED"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Send email
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "FitCheck'e ${{ steps.body.outputs.count }} Yeni Özellik Eklendi!"
          to: yusufbuber38@gmail.com,azraturidi1632@gmail.com,yildizsevvalyardimci@gmail.com,ediz.kacmaz19@gmail.com
          from: FitCheck
          body: ${{ steps.body.outputs.body }}

      # Best-effort: also drop the same announcement into the in-app
      # notification bell for every real user. Only reaches the backend if
      # the dev PC + Cloudflare Tunnel happen to be up at push time (the
      # tunnel URL is read live from the tracking Google Sheet) - if not,
      # this step just fails harmlessly and only the email above went out.
      - name: Push in-app notification (best effort, needs dev PC+tunnel online)
        continue-on-error: true
        run: |
          TUNNEL_URL=$(curl -s -L --max-time 15 \
            "https://docs.google.com/spreadsheets/d/12bgCT-jYVhH7nbECrVFUdaRwnY_A92Nf9-MvyPetaKM/export?format=csv&gid=0" \
            | head -1 | cut -d',' -f2 | tr -d '\r')

          if [ -z "$TUNNEL_URL" ]; then
            echo "No tunnel URL found in sheet, skipping in-app notification."
            exit 0
          fi

          curl -sf --max-time 20 -X POST \
            "${TUNNEL_URL}/nutritionlibrary-api/v1/system/broadcast-notify" \
            -H "Content-Type: application/json" \
            -H "x-broadcast-key: ${{ secrets.BROADCAST_NOTIFY_KEY }}" \
            -d "$(jq -n \
                --arg title "FitCheck'e ${{ steps.body.outputs.count }} Yeni Özellik Eklendi!" \
                --arg body "${{ steps.body.outputs.notifybody }}" \
                '{title: $title, body: $body}')" \
            || echo "In-app notification push failed (PC/tunnel likely offline) - email already sent, continuing."
