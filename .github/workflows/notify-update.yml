name: Daily digest email

# Sends ONE email per day summarizing all commits pushed to main that day,
# instead of a separate email per commit/push. Fires once at 21:00 UTC
# (= 00:00 Turkey time, i.e. right as the Turkish calendar day ends), so
# `git log --since="24 hours ago"` on the runner's UTC clock captures
# exactly that Turkish day's commits, and the runner's own UTC date at
# trigger time (still the day that just ended in Turkey) is what the
# subject's date is built from. Also triggerable manually via
# workflow_dispatch for testing without waiting for the schedule.
on:
  schedule:
    - cron: "0 21 * * *"
  workflow_dispatch: {}

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build digest subject + body from today's commits
        id: body
        run: |
          COMMITS=$(git log main --since="24 hours ago" --pretty=format:"%s" --no-merges)
          COUNT=$(printf "%s\n" "$COMMITS" | grep -c . || true)

          echo "count=$COUNT" >> "$GITHUB_OUTPUT"
          if [ "$COUNT" -eq 0 ]; then
            echo "No commits in the last 24h, skipping digest email."
            exit 0
          fi

          simplify() {
            local line="$1"
            # Drop conventional-commit prefix (feat:, fix:, docs:, chore:, refactor:, test:, style:, perf:)
            line=$(echo "$line" | sed -E 's/^(feat|fix|docs|chore|refactor|test|style|perf)(\([^)]*\))?: *//')
            # Plain-language glossary for common technical jargon
            line=$(echo "$line" | sed -E \
              -e 's/GitHub Actions workflow.?u?/otomatik bildirim sistemi/gi' \
              -e 's/bulk-import/toplu veri aktarımı/gi' \
              -e 's/dishCategory/yemek kategorisi/gi' \
              -e 's/DishLine/yemek malzemesi/gi' \
              -e 's/FoodPickerModal/besin seçme ekranı/gi' \
              -e 's/API/sistem/gi' \
              -e 's/tab bar/sekme çubuğu/gi' \
              -e 's/backend/arka plan/gi' \
              -e 's/frontend/arayüz/gi')
            # Capitalize first letter
            line="$(echo "${line:0:1}" | tr '[:lower:]' '[:upper:]')${line:1}"
            echo "$line"
          }

          # Turkish day + abbreviated-month label for the day that just
          # ended (see header comment for why plain UTC `date` at trigger
          # time already points at the right day).
          DAY=$(date -u +%-d)
          MONTH_NUM=$(date -u +%-m)
          MONTH_NAMES=(Oca Şub Mar Nis May Haz Tem Ağu Eyl Eki Kas Ara)
          MONTH_TR="${MONTH_NAMES[$((MONTH_NUM - 1))]}"
          DATE_LABEL="${DAY}${MONTH_TR}"
          echo "datelabel=$DATE_LABEL" >> "$GITHUB_OUTPUT"

          SIMPLIFIED=""
          while IFS= read -r line; do
            [ -z "$line" ] && continue
            s="$(simplify "$line")"
            SIMPLIFIED="${SIMPLIFIED}${SIMPLIFIED:+ • }${s}"
          done <<< "$COMMITS"

          {
            echo "body<<EOF"
            echo "Bugün FitCheck'te ${COUNT} güncelleme yapıldı."
            echo ""
            echo "Bugünün değişiklikleri:"
            while IFS= read -r line; do
              [ -z "$line" ] && continue
              echo "- $(simplify "$line")"
            done <<< "$COMMITS"
            echo ""
            echo "Detaylar: https://github.com/${{ github.repository }}/commits/main"
            echo ""
            echo "Yemenin tadını çıkarın."
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

          {
            echo "notifybody<<EOF"
            echo "$SIMPLIFIED"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Send email
        if: steps.body.outputs.count != '0'
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "FitCheck | Gün Sonu Değerlendirmesi - ${{ steps.body.outputs.datelabel }}"
          to: yusufbuber38@gmail.com,azraturidi1632@gmail.com,yildizsevvalyardimci@gmail.com,ediz.kacmaz19@gmail.com
          from: FitCheck
          body: ${{ steps.body.outputs.body }}

      # Best-effort: also drop the same digest into the in-app notification
      # bell for every real user. Only reaches the backend if the dev PC +
      # Cloudflare Tunnel happen to be up at digest time (the tunnel URL is
      # read live from the tracking Google Sheet) - if not, this step just
      # fails harmlessly and only the email above went out.
      - name: Push in-app notification (best effort, needs dev PC+tunnel online)
        if: steps.body.outputs.count != '0'
        continue-on-error: true
        run: |
          TUNNEL_URL=$(curl -s -L --max-time 15 \
            "https://docs.google.com/spreadsheets/d/12bgCT-jYVhH7nbECrVFUdaRwnY_A92Nf9-MvyPetaKM/export?format=csv&gid=0" \
            | head -1 | cut -d',' -f2 | tr -d '\r')

          if [ -z "$TUNNEL_URL" ]; then
            echo "No tunnel URL found in sheet, skipping in-app notification."
            exit 0
          fi

          curl -sf --max-time 20 -X POST \
            "${TUNNEL_URL}/nutritionlibrary-api/v1/system/broadcast-notify" \
            -H "Content-Type: application/json" \
            -H "x-broadcast-key: ${{ secrets.BROADCAST_NOTIFY_KEY }}" \
            -d "$(jq -n \
                --arg title "FitCheck | Gün Sonu Değerlendirmesi - ${{ steps.body.outputs.datelabel }}" \
                --arg body "${{ steps.body.outputs.notifybody }}" \
                '{title: $title, body: $body}')" \
            || echo "In-app notification push failed (PC/tunnel likely offline) - email already sent, continuing."
