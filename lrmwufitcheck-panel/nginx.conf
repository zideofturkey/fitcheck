server {
    listen 80;
    server_name _;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Redirect /panel to /panel/ for consistency
    location = /panel {
        return 301 /panel/;
    }

    # Handle React Router (SPA routing) at /panel/
    # Named fallback (@spa) avoids try_files re-entering this location block,
    # which can create an internal-redirect loop with alias directives.
    location /panel/ {
        alias /usr/share/nginx/html/;
        index index.html;
        try_files $uri $uri/ @spa;
    }

    location @spa {
        root /usr/share/nginx/html;
        rewrite ^ /index.html break;
    }

    # Health check endpoint
    location = /health {
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }
}
